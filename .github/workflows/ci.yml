name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Typecheck & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache liboqs installation
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: /usr/local
          key: liboqs-0.16.0-${{ runner.os }}-${{ runner.arch }}

      - name: Build and install liboqs 0.16.0
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          INSTALL_PREFIX=/usr/local PYTHON_BIN=python ./deploy/scripts/install_liboqs.sh

      - name: Refresh shared library cache
        run: sudo ldconfig

      - name: Install pq-edge-bridge with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check src tests benchmarks

      - name: Run strict Mypy type checks
        run: mypy src tests

      - name: Run Pytest suite
        env:
          LD_LIBRARY_PATH: /usr/local/lib
        run: pytest -v

  docker:
    name: Multi-Arch Docker Build (amd64, arm64)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-arch container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
