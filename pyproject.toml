[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pq-edge-bridge"
version = "0.1.0"
description = "Lightweight, production-grade Post-Quantum Telemetry Bridge for Edge, IoT, and Robotics (ML-KEM-768 + ML-DSA-65 + AES-256-GCM)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Pelle Nyberg", email = "pelle@coraxcolab.com" },
]
maintainers = [
    { name = "Corax CoLAB", email = "hello@coraxcolab.com" },
]
keywords = [
    "post-quantum-cryptography",
    "pqc",
    "ml-kem",
    "ml-dsa",
    "liboqs",
    "mqtt",
    "ros2",
    "iot",
    "edge-computing",
    "telemetry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42.0.0",
    "liboqs-python>=0.16.0,<0.17.0",
    "paho-mqtt>=2.1.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
ros2 = [
    "rclpy",
]
benchmarks = [
    "psutil>=5.9.0",
]
dev = [
    "mypy>=1.10.0",
    "psutil>=5.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
pq-edge-bridge = "pq_edge_bridge.cli:app"

[project.urls]
Homepage = "https://coraxcolab.com"
Repository = "https://github.com/PelleNybe/pq-edge-bridge"
Issues = "https://github.com/PelleNybe/pq-edge-bridge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pq_edge_bridge = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "TCH",
    "RUF",
]
ignore = [
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["pq_edge_bridge"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "oqs",
    "rclpy",
    "rclpy.*",
    "std_msgs.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q"
